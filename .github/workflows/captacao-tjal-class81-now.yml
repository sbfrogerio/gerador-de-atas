name: Captacao TJAL classe 81 manual agora

on:
  push:
    branches:
      - 'chatgpt/captacao-tjal-run-now-20260908'
    paths:
      - '.github/workflows/captacao-tjal-class81-now.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/captacao-tjal-run-now-20260908
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - run: python tmp/run_class81_today.py
      - uses: actions/upload-artifact@v4
        with:
          name: captacao-tjal-class81-now
          path: tmp/class81_output/
          retention-days: 1