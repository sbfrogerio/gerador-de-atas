name: Captacao TJAL v0.7 manual agora

on:
  push:
    branches:
      - 'chatgpt/captacao-tjal-run-now-20260908'
    paths:
      - '.github/workflows/captacao-tjal-run-now.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/captacao-tjal-run-now-20260908
      - name: Preparar leitor do DJe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Executar coleta v0.7
        run: python tmp/run_captacao_now.py
      - name: Publicar resultado temporario
        uses: actions/upload-artifact@v4
        with:
          name: captacao-tjal-v07-run-now
          path: tmp/run_now_output/
          retention-days: 1